<svg width="1104" height="206" viewBox="0 0 1104 206" xmlns="http://www.w3.org/2000/svg"><rect x="16" y="34" width="306" height="106" rx="16" fill="#1F7A5C" /><text x="169" y="78" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF" font-family="PingFang SC">1  提一个带背景的问题</text><text x="169" y="112" text-anchor="middle" font-size="19" fill="#FFFFFF" opacity="0.85" font-family="PingFang SC">把人群、状态、困扰写进问句</text><path d="M330 87 L392 87" stroke="#A8D5BA" stroke-width="5" /><path d="M380 75 L398 87 L380 99 Z" fill="#A8D5BA" /><rect x="400" y="34" width="306" height="106" rx="16" fill="rgba(168,213,186,0.5)" /><text x="553" y="78" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E3A32" font-family="PingFang SC">2  读完三条案例卡</text><text x="553" y="112" text-anchor="middle" font-size="19" fill="#1E3A32" opacity="0.75" font-family="PingFang SC">重点看画像和场景，不看热闹</text><path d="M714 87 L776 87" stroke="#A8D5BA" stroke-width="5" /><path d="M764 75 L782 87 L764 99 Z" fill="#A8D5BA" /><rect x="784" y="34" width="306" height="106" rx="16" fill="#E08A3C" /><text x="937" y="78" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF" font-family="PingFang SC">3  选出最像的一条</text><text x="937" y="112" text-anchor="middle" font-size="19" fill="#FFFFFF" opacity="0.9" font-family="PingFang SC">并说得出为什么像、学到哪一点</text><text x="169" y="186" text-anchor="middle" font-size="18" fill="#6B7C75" font-family="PingFang SC">问得越具体，案例越准</text><text x="553" y="186" text-anchor="middle" font-size="18" fill="#6B7C75" font-family="PingFang SC">三问过滤，不合适就跳过</text><text x="937" y="186" text-anchor="middle" font-size="18" fill="#6B7C75" font-family="PingFang SC">一次只学一样</text></svg>