<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI宝儿智能体</title>
  <meta name="description" content="产品咨询、使用答疑与健康问题解答">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AI宝儿智能体">
  <meta property="og:title" content="AI宝儿智能体">
  <meta property="og:description" content="产品咨询、使用答疑与健康问题解答">
  <meta property="og:image" content="/avatar-optimized.png">

  <meta name="twitter:card" content="summary">

  <meta name="twitter:image" content="/avatar-optimized.png">
  <script>
    /* 分享功能总开关（2026-09-04 关闭）：生成分享图非主要使用场景，整体隐藏入口。
       恢复方式：改为 true，并按项目惯例同步升级 chat.js / admin-share.js 的 ?v= 版本号。
       注意：本开关只管「生成分享图」。后台「分享设置」（微信 og 卡片）不受影响，
       那决定链接在微信里被转发时的卡片样式，关掉反而更糟。 */
    window.SHARE_ENABLED = false;
  </script>
  <script>
    if (window.location.protocol === 'file:') {
      window.location.replace('http://127.0.0.1:5001/');
    }
  </script>
  <link rel="stylesheet" href="/css/base.css?v=20260720-split1">
  <link rel="stylesheet" href="/css/home.css?v=20260720-split1">
  <link rel="stylesheet" href="/css/chat.css?v=20260907-voice-toggle1">
  <link rel="stylesheet" href="/css/community.css?v=20260720-split1">
  <link rel="stylesheet" href="/css/overlays.css?v=20260720-split1">
  <link rel="stylesheet" href="/css/news-nav.css?v=20260908-icons1">
  <link rel="stylesheet" href="/css/chat-ui.css?v=20260721-clear1">
  <link rel="stylesheet" href="/css/rich-text.css?v=20260907-prodfix2">
  <link rel="stylesheet" href="/css/related-cases.css?v=20260720-split1">
  <link rel="stylesheet" href="/css/share-misc.css?v=20260720-split1">
  <link rel="stylesheet" href="/css/products.css?v=20260902-prodimg2">
  <link rel="stylesheet" href="/css/discover.css?v=20260903-preset-agent1">
  <link rel="stylesheet" href="/css/handoff.css?v=20260723-ai-review1">
  <link rel="stylesheet" href="icon-fallback.css?v=20260908-icons1">
</head>
<body>
  <div id="identity-gate" class="admin-overlay active" onclick="event.stopPropagation();">
    <div class="login-card" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,360px);">
      <div class="login-header" style="margin-bottom:18px;">
        <div class="login-title" style="font-size:22px;">开始咨询</div>
        <div class="login-subtitle">请选择团队并输入姓名</div>
      </div>
      <div class="input-group">
        <svg class="icon icon-users-three" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
  <circle cx="12" cy="7" r="3.3" fill="currentColor"/>
  <path d="M12 11.4c3.4 0 6.2 1.9 6.2 4v2.6H5.8v-2.6c0-2.1 2.8-4 6.2-4Z" fill="currentColor"/>
  <circle cx="4.3" cy="9.9" r="2.4" fill="currentColor"/>
  <circle cx="19.7" cy="9.9" r="2.4" fill="currentColor"/>
</svg>
        <select id="team-select" style="width:100%;padding:14px 16px 14px 46px;font-size:15px;font-family:inherit;background:var(--slate-50);border:2px solid transparent;border-radius:var(--radius-xl);outline:none;">
          <option value="">请选择团队</option>
        </select>
      </div>
      <div class="input-group">
        <svg class="icon icon-user" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path d="M12 3.2a4.2 4.2 0 1 0 0 8.4 4.2 4.2 0 0 0 0-8.4zM12 13c-4.2 0-7.6 2.5-7.6 5.4V21h15.2v-2.6C19.6 15.5 16.2 13 12 13z" fill="currentColor"/></svg>
        <input id="member-name-input" type="text" placeholder="请输入姓名" maxlength="20">
      </div>
      <button class="btn-primary" onclick="submitIdentity()">进入系统</button>
    </div>
  </div>

  <div id="app" class="page active">
    <div id="app-container">
      <button id="nutritionist-note-alert" class="nutritionist-note-alert" type="button" hidden onclick="openLatestNutritionistNote()">
        <span class="nutritionist-note-alert-icon"><svg class="icon icon-headset" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
  <path d="M4.2 13.8v-1.8a7.8 7.8 0 0 1 15.6 0v1.8h-2.6V12a5.2 5.2 0 0 0-10.4 0v1.8H4.2Z" fill="currentColor"/>
  <rect x="2.6" y="12.6" width="4.4" height="7.4" rx="2.2" fill="currentColor"/>
  <rect x="17" y="12.6" width="4.4" height="7.4" rx="2.2" fill="currentColor"/>
</svg></span>
        <span><strong>在线营养师有新留言</strong><small id="nutritionist-note-alert-text">点击查看补充内容</small></span>
        <b id="nutritionist-note-alert-count">1</b><svg class="icon icon-caret-right" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path d="M8.8 4.2 16.6 12l-7.8 7.8V4.2z" fill="currentColor"/></svg>
      </button>
      <!-- Home View -->
      <div id="home-view" class="view active">
        <div class="home-content">
          <div class="home-header">
            <div class="home-greeting">
              <p class="greeting-line1">你好👋</p>
              <p class="greeting-line2">我是AI宝儿</p>
              <p class="greeting-line3">今天想让我为你做点什么</p>
            </div>
            <div class="avatar-ring">
              <img src="/avatar-optimized.png" class="avatar-img" alt="avatar" loading="eager" decoding="async" fetchpriority="high">
            </div>
          </div>
          <div class="home-bulletin" id="home-bulletin" hidden aria-label="精选资讯">
            <div class="bulletin-mark"><svg class="icon icon-sparkle" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
  <path d="M11 2.2L13.2 9.4L20.6 11.4L13.2 13.4L11 20.6L8.8 13.4L1.4 11.4L8.8 9.4Z" fill="currentColor"/>
  <path d="M18.8 1.8L19.7 4.9L22.8 5.8L19.7 6.7L18.8 9.8L17.9 6.7L14.8 5.8L17.9 4.9Z" fill="currentColor"/>
</svg><span>精选</span></div>
            <div class="bulletin-window"><div class="bulletin-track" id="home-bulletin-track"></div></div>
            <button type="button" class="bulletin-arrow" aria-label="查看精选资讯" onclick="openHomeBulletin()"><svg class="icon icon-arrow-right" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path d="M12.7 4.7 19.4 11.5H3v2h16.4l-6.7 6.8 1.4 1.4L23 12l-8.9-8.7-1.4 1.4z" fill="currentColor"/></svg></button>
          </div>
          <div class="section">
            <div class="section-header">
              <h3 class="section-title">快捷功能</h3>
            </div>
            <div class="quick-grid" id="quick-grid"></div>
            <div class="example-question-wrap">
              <div class="example-question-title">不知道怎么问？试试这些</div>
              <div class="example-question-list" id="example-question-list"></div>
            </div>
          </div>
          <div class="section">
            <div class="section-header">
              <h3 class="section-title">热门问题</h3>
            </div>
            <div class="hot-tags" id="hot-tags"></div>
          </div>
          <div class="section">
            <div class="section-header">
              <h3 class="section-title">最新资讯</h3>
            </div>
            <div class="news-list" id="home-news"></div>
            <button class="view-all-link" onclick="switchView('discover')">查看全部 <svg class="icon icon-arrow-right" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path d="M12.7 4.7 19.4 11.5H3v2h16.4l-6.7 6.8 1.4 1.4L23 12l-8.9-8.7-1.4 1.4z" fill="currentColor"/></svg></button>
          </div>
        </div>
      </div>

      <!-- Chat View -->
      <div id="chat-view" class="view">
        <header class="chat-header">
          <div class="chat-header-top">
            <button class="icon-btn" onclick="switchView('home')"><svg class="icon icon-caret-left" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path d="M15.2 4.2v15.6L7.4 12l7.8-7.8z" fill="currentColor"/></svg></button>
            <div class="chat-agent-info">
              <span class="chat-agent-name" id="chat-agent-name">产品资料查询</span>
            </div>
            <button class="icon-btn chat-clear-btn" onclick="clearChat()" aria-label="清空聊天记录" title="清空聊天记录">
              <span aria-hidden="true">清</span>
            </button>
          </div>
          <div class="agent-tabs" id="agent-tabs"></div>
        </header>
        <div id="handoff-status" class="handoff-status" hidden>
          <div><span id="handoff-status-dot" class="handoff-status-dot"></span><strong id="handoff-status-title">正在排队</strong><small id="handoff-status-detail"></small></div>
          <div class="handoff-status-actions">
            <button id="handoff-defer-action" type="button" onclick="deferHandoffSession()">转为留言</button>
            <button id="handoff-status-action" type="button" onclick="handleHandoffStatusAction()">取消排队</button>
          </div>
        </div>
        <div class="chat-messages" id="chat-messages">
          <div class="empty-chat" id="empty-chat">
            <svg class="icon icon-sparkle" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
  <path d="M11 2.2L13.2 9.4L20.6 11.4L13.2 13.4L11 20.6L8.8 13.4L1.4 11.4L8.8 9.4Z" fill="currentColor"/>
  <path d="M18.8 1.8L19.7 4.9L22.8 5.8L19.7 6.7L18.8 9.8L17.9 6.7L14.8 5.8L17.9 4.9Z" fill="currentColor"/>
</svg>
            <p>开始一段新的对话吧</p>
          </div>
        </div>
        <div class="chat-input-area">
          <button type="button" class="voice-btn" id="voice-btn" data-voice-icon="mic" style="display:none" title="点击开始录音" aria-label="点击开始录音" aria-pressed="false"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9.2" y="2.6" width="5.6" height="10.8" rx="2.8"/><path d="M5.6 11.2v.9a6.4 6.4 0 0 0 12.8 0v-.9"/><path d="M12 18.6v2.1"/><path d="M8.7 20.7h6.6"/></svg></button>
          <div class="input-wrapper">
            <button class="input-plus"><svg class="icon icon-plus" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path d="M11 4.5h2v6.5H20v2h-7v6.5h-2V13H4v-2h7V4.5z" fill="currentColor"/></svg></button>
            <textarea id="message-input" rows="1" placeholder="说点什么..." onkeydown="handleInputKeydown(event)"></textarea>
            <button class="send-btn" id="send-btn" onclick="sendMessage()"><svg class="icon icon-paper-plane-right" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path d="M21.8 2.2 15 21.8l-3.9-8.9L2.2 9l19.6-6.8z" fill="currentColor"/></svg></button>
          </div>
          <div class="voice-status" id="voice-status" role="status" aria-live="polite" style="display:none">
            <span class="voice-live-dot" aria-hidden="true"></span>
            <span id="voice-status-text">正在录音</span>
            <span class="voice-timer" id="voice-timer">00:00</span>
            <span class="voice-meter" id="voice-meter" aria-hidden="true">
              <i></i><i></i><i></i><i></i><i></i>
            </span>
            <button type="button" class="voice-cancel-btn" id="voice-cancel-btn" onclick="cancelVoiceInput()">取消</button>
          </div>
          <button class="scroll-bottom-btn" id="scroll-bottom-btn" onclick="scrollToBottom()">
            <svg class="icon icon-arrow-down" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path transform="rotate(90 12 12)" d="M12.7 4.7 19.4 11.5H3v2h16.4l-6.7 6.8 1.4 1.4L23 12l-8.9-8.7-1.4 1.4z" fill="currentColor"/></svg>
          </button>
        </div>
      </div>

      <!-- Products View -->
      <div id="products-view" class="view">
        <header class="memory-header" style="border-bottom:none">
          <h1 class="memory-title">产品中心</h1>
        </header>
        <div class="products-content" id="products-content">
          <div class="products-loading"><svg class="icon icon-spinner" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path d="M12 2.6a9.4 9.4 0 1 0 9.4 9.4" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg> 加载中...</div>
        </div>
      </div>

      <!-- Discover View -->
      <div id="discover-view" class="view">
        <header class="memory-header">
          <h1 class="memory-title">发现</h1>
        </header>
        <div class="discover-content" id="discover-content">
          <div class="category-tabs" id="category-tabs">
            <button class="category-tab active" onclick="filterCategory('')">全部</button>
          </div>
          <div class="discover-carousel-wrap" id="discover-carousel-wrap" style="display:none">
            <div class="discover-carousel" id="discover-carousel"></div>
            <div class="carousel-dots" id="carousel-dots"></div>
          </div>
          <div class="discover-list" id="discover-list"></div>
          <div class="discover-more-wrap" id="discover-more-wrap" style="display:none">
            <button class="discover-more-btn" onclick="loadMoreNews()">加载更多</button>
          </div>
        </div>
      </div>

      <!-- Community View -->
      <div id="community-view" class="view">
        <header class="memory-header">
          <h1 class="memory-title">社区</h1>
        </header>
        <div class="community-content">
          <div class="community-tabs">
            <button class="community-tab" onclick="switchCommunityTab('memory')">我的对话</button>
            <button class="community-tab active" onclick="switchCommunityTab('qa')">问答墙</button>
          </div>
          <div id="community-tab-memory" class="community-panel">
            <div class="memory-filter">
              <select id="memory-filter" onchange="loadHistory(this.value)">
                <option value="">全部类型</option>
                <option value="产品咨询">产品咨询</option>
                <option value="使用答疑">使用答疑</option>
                <option value="朋友圈帮写">朋友圈帮写</option>
                <option value="口播文案帮写">口播文案</option>
              </select>
            </div>
            <div class="memory-list" id="memory-list"></div>
          </div>
          <div id="community-tab-qa" class="community-panel active">
            <div class="qa-list" id="qa-list"></div>
            <div class="qa-more-wrap" id="qa-more-wrap" style="display:none">
              <button class="discover-more-btn" onclick="loadMoreQA()">加载更多</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Bottom Navigation -->
      <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchView('home')" data-view="home">
          <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M12 2.4l9.9 7.9v11.3H2.1V10.3L12 2.4ZM10 15h4v6.6h-4V15Z"/></svg><span>首页</span>
        </button>
        <button class="nav-item" onclick="switchView('products')" data-view="products">
          <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><rect x="3" y="7.6" width="18" height="13.8" rx="2.6" fill="currentColor"/><path d="M8.2 7.9V6a3.8 3.8 0 0 1 7.6 0v1.9h-2.3V6a1.5 1.5 0 0 0-3 0v1.9H8.2Z" fill="currentColor"/></svg><span>产品</span>
        </button>
        <div class="nav-ai-wrap">
          <button class="nav-ai-btn" onclick="switchView('chat')"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path d="M11 2.2L13.2 9.4L20.6 11.4L13.2 13.4L11 20.6L8.8 13.4L1.4 11.4L8.8 9.4Z" fill="currentColor"/><path d="M18.8 1.8L19.7 4.9L22.8 5.8L19.7 6.7L18.8 9.8L17.9 6.7L14.8 5.8L17.9 4.9Z" fill="currentColor"/></svg></button>
        </div>
        <button class="nav-item" onclick="switchView('discover')" data-view="discover">
          <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M12 2.2a9.8 9.8 0 1 0 0 19.6 9.8 9.8 0 0 0 0-19.6ZM12 4.8a7.2 7.2 0 1 1 0 14.4 7.2 7.2 0 0 1 0-14.4Z"/><path fill="currentColor" d="M16.2 7.8L13.6 13.6L7.8 16.2L10.4 10.4L16.2 7.8Z"/></svg><span>发现</span>
        </button>
        <button class="nav-item" onclick="switchView('community')" data-view="community">
          <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><circle cx="12" cy="7" r="3.3" fill="currentColor"/><path d="M12 11.4c3.4 0 6.2 1.9 6.2 4v2.6H5.8v-2.6c0-2.1 2.8-4 6.2-4Z" fill="currentColor"/><circle cx="4.3" cy="9.9" r="2.4" fill="currentColor"/><circle cx="19.7" cy="9.9" r="2.4" fill="currentColor"/></svg><span>社区</span>
        </button>
      </nav>

      <!-- News Detail Overlay -->
      <div id="news-detail-overlay" class="admin-overlay">
        <div class="news-detail-panel">
          <header class="news-detail-header">
            <button class="icon-btn" onclick="closeNewsDetail()"><svg class="icon icon-x" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z" fill="currentColor"/></svg></button>
          </header>
          <div class="news-detail-scroll" id="news-detail-content"></div>
        </div>
      </div>

      <!-- Product Detail Overlay -->
      <div id="product-detail-overlay" class="admin-overlay">
        <div class="news-detail-panel">
          <header class="news-detail-header">
            <button class="icon-btn" onclick="closeProductDetail()"><svg class="icon icon-x" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z" fill="currentColor"/></svg></button>
          </header>
          <div class="news-detail-scroll" id="product-detail-content"></div>
          <div class="product-detail-cta">
            <button class="product-cta-btn" id="product-cta-btn" onclick="consultProduct()">
              <svg class="icon icon-chat-circle-text" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
  <path fill-rule="evenodd" clip-rule="evenodd" d="M7 4.2h10a4.2 4.2 0 0 1 4.2 4.2V13a4.2 4.2 0 0 1-4.2 4.2H7A4.2 4.2 0 0 1 2.8 13V8.4A4.2 4.2 0 0 1 7 4.2ZM8.4 8.4a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8ZM12 8.4a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8ZM15.6 8.4a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8Z" fill="currentColor"/>
  <path d="M8.8 16.6h4.4L7.4 21.8l1.4-5.2Z" fill="currentColor"/>
</svg> 立即咨询
            </button>
          </div>
        </div>
      </div>

      <!-- Share Preview Overlay -->
      <div id="share-overlay" class="admin-overlay" onclick="closeSharePreview(event)">
        <div class="share-panel" onclick="event.stopPropagation()">
          <div class="share-panel-header">
            <span class="share-panel-title">微信分享图</span>
            <button class="icon-btn" onclick="closeSharePreview()"><svg class="icon icon-x" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z" fill="currentColor"/></svg></button>
          </div>
          <div class="share-panel-body">
            <div class="share-image-wrap" id="share-image-wrap">
              <div class="share-loading"><svg class="icon icon-spinner-gap" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path d="M12 2.6a9.4 9.4 0 1 1-9.4 9.4" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg> 生成中...</div>
            </div>
          </div>
          <div class="share-panel-footer">
            <p class="share-tip"><svg class="icon icon-hand-fist" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path d="M6.5 12.5v-3h2.8V7h2.5v2h2.5V7.5h2.5V15a5.5 5.5 0 0 1-5.5 5.5h-.6A5.5 5.5 0 0 1 6.5 15v-2.5z" fill="currentColor"/></svg> 微信内长按图片保存或转发</p>
          </div>
        </div>
      </div>

      <!-- Hidden Share Card -->
      <div id="share-card" class="share-card" style="position:fixed;left:-9999px;top:0;width:390px;background:#fff;padding:24px;font-family:'Inter',sans-serif;z-index:-1;">
        <div id="share-card-content"></div>
      </div>

      <!-- Nickname Modal -->
      <div id="lead-overlay" class="admin-overlay" onclick="closeLeadModal(event)">
        <div class="login-card lead-modal" onclick="event.stopPropagation()">
          <div class="login-header"><div class="login-title">获取专属方案</div><div class="login-subtitle">留下需求，我们会尽快与您联系</div></div>
          <label class="lead-label">您的身份</label>
          <select id="lead-customer-type" class="lead-input"><option value="consumer">消费者</option><option value="partner">经销商/合作伙伴</option></select>
          <label class="lead-label">关注产品（选填）</label>
          <input id="lead-product" class="lead-input" maxlength="100" placeholder="请输入产品名称">
          <label class="lead-label">您的需求</label>
          <textarea id="lead-description" class="lead-input" maxlength="1000" rows="4" placeholder="例如：想了解适合门店推荐的产品方案"></textarea>
          <label class="lead-label">手机号或微信号（至少填写一项）</label>
          <input id="lead-phone" class="lead-input" maxlength="11" inputmode="tel" placeholder="手机号">
          <input id="lead-wechat" class="lead-input" maxlength="80" placeholder="微信号（手机号未填时填写）">
          <div class="lead-actions"><button class="btn-secondary" onclick="closeLeadModal()">稍后再说</button><button class="btn-primary" id="lead-submit-btn" onclick="submitLeadRequest()">提交需求</button></div>
          <div id="lead-error" class="lead-error"></div>
        </div>
      </div>
      <div id="nickname-overlay" class="admin-overlay" onclick="closeNicknameModal(event)">
        <div class="nickname-modal" onclick="event.stopPropagation()">
          <div class="nickname-header">输入你的昵称</div>
          <input type="text" id="nickname-input" placeholder="你的昵称" maxlength="20" class="nickname-input">
          <div class="nickname-actions">
            <button class="btn btn-primary btn-sm" onclick="confirmNickname()">确定</button>
          </div>
        </div>
      </div>

      <div id="reason-popup" class="reason-popup"></div>

      <!-- AI-first human handoff choice -->
      <div id="handoff-choice-overlay" class="admin-overlay handoff-choice-overlay" aria-hidden="true" onclick="closeHandoffChoice(event)">
        <section class="handoff-choice-sheet" role="dialog" aria-modal="true" aria-labelledby="handoff-choice-title" onclick="event.stopPropagation()">
          <div class="handoff-choice-handle" aria-hidden="true"></div>
          <button type="button" class="handoff-choice-close" aria-label="关闭" onclick="closeHandoffChoice()"><svg class="icon icon-x" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z" fill="currentColor"/></svg></button>
          <div class="handoff-choice-icon"><svg class="icon icon-sparkle" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
  <path d="M11 2.2L13.2 9.4L20.6 11.4L13.2 13.4L11 20.6L8.8 13.4L1.4 11.4L8.8 9.4Z" fill="currentColor"/>
  <path d="M18.8 1.8L19.7 4.9L22.8 5.8L19.7 6.7L18.8 9.8L17.9 6.7L14.8 5.8L17.9 4.9Z" fill="currentColor"/>
</svg></div>
          <h2 id="handoff-choice-title">要联系在线营养师吗？</h2>
          <p>AI 通常响应更快，建议先让营养咨询 AI 继续帮你；如仍需真人，也可以立即转接。</p>
          <div class="handoff-choice-ai-note"><svg class="icon icon-robot" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
  <path fill-rule="evenodd" clip-rule="evenodd" d="M8.2 7.6h7.6a3.6 3.6 0 0 1 3.6 3.6v5.2a3.6 3.6 0 0 1-3.6 3.6H8.2A3.6 3.6 0 0 1 4.6 16.4v-5.2a3.6 3.6 0 0 1 3.6-3.6ZM9.3 11.8a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3ZM14.7 11.8a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z" fill="currentColor"/>
  <rect x="11.1" y="5.2" width="1.8" height="2.6" rx="0.9" fill="currentColor"/>
  <circle cx="12" cy="3.6" r="1.7" fill="currentColor"/>
</svg><span id="handoff-choice-ai-name">将由营养咨询 AI 继续解答</span></div>
          <div id="handoff-choice-status" class="handoff-choice-status"></div>
          <label class="handoff-choice-note-label" for="handoff-choice-note">给营养师的留言</label>
          <textarea id="handoff-choice-note" class="handoff-choice-note" rows="3" maxlength="2000" placeholder="请描述想让营养师重点了解的问题" oninput="syncHandoffDraftState()"></textarea>
          <div id="handoff-choice-note-error" class="handoff-choice-note-error" role="alert"></div>
          <button type="button" id="handoff-choice-ai" class="handoff-choice-primary" onclick="chooseHandoffAi()">继续用 AI</button>
          <button type="button" id="handoff-choice-human" class="handoff-choice-secondary" onclick="chooseHumanHandoff()">确认并联系营养师</button>
          <button type="button" class="handoff-choice-later" onclick="closeHandoffChoice()">暂不处理</button>
        </section>
      </div>

      <!-- Survey Overlay -->
      <div id="survey-overlay" class="admin-overlay" onclick="event.stopPropagation();">

          </div>
        </div>

            <button class="icon-btn" onclick="closeQDetail()"><svg class="icon icon-x" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z" fill="currentColor"/></svg></button>
