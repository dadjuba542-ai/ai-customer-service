<svg width="1104" height="268" viewBox="0 0 1104 268" xmlns="http://www.w3.org/2000/svg"><rect x="14" y="72" width="182" height="92" rx="16" fill="#1F7A5C" /><text x="105" y="112" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFFFFF" font-family="PingFang SC">1 输入问题</text><text x="105" y="142" text-anchor="middle" font-size="18" fill="#FFFFFF" opacity="0.85" font-family="PingFang SC">像聊天一样打一句话</text><path d="M204 118 L228 118" stroke="#A8D5BA" stroke-width="4" /><path d="M220 110 L232 118 L220 126 Z" fill="#A8D5BA" /><rect x="240" y="72" width="182" height="92" rx="16" fill="rgba(168,213,186,0.5)" /><text x="331" y="112" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E3A32" font-family="PingFang SC">2 等它说完</text><text x="331" y="142" text-anchor="middle" font-size="18" fill="#1E3A32" opacity="0.75" font-family="PingFang SC">文字是一段段出来的</text><path d="M430 118 L454 118" stroke="#A8D5BA" stroke-width="4" /><path d="M446 110 L458 118 L446 126 Z" fill="#A8D5BA" /><rect x="466" y="72" width="182" height="92" rx="16" fill="rgba(168,213,186,0.5)" /><text x="557" y="112" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E3A32" font-family="PingFang SC">3 先看结论</text><text x="557" y="142" text-anchor="middle" font-size="18" fill="#1E3A32" opacity="0.75" font-family="PingFang SC">结论通常在最前面</text><path d="M656 118 L680 118" stroke="#A8D5BA" stroke-width="4" /><path d="M672 110 L684 118 L672 126 Z" fill="#A8D5BA" /><rect x="692" y="72" width="182" height="92" rx="16" fill="#1F7A5C" /><text x="783" y="112" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFFFFF" font-family="PingFang SC">4 看相关案例</text><text x="783" y="142" text-anchor="middle" font-size="18" fill="#FFFFFF" opacity="0.85" font-family="PingFang SC">回答下方自动推荐</text><path d="M882 118 L906 118" stroke="#A8D5BA" stroke-width="4" /><path d="M898 110 L910 118 L898 126 Z" fill="#A8D5BA" /><rect x="918" y="72" width="182" height="92" rx="16" fill="#E08A3C" /><text x="1009" y="112" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFFFFF" font-family="PingFang SC">5 继续追问</text><text x="1009" y="142" text-anchor="middle" font-size="18" fill="#FFFFFF" opacity="0.9" font-family="PingFang SC">没看懂就换个问法</text><text x="105" y="212" text-anchor="middle" font-size="17" fill="#6B7C75" font-family="PingFang SC">别追求一次问对</text><text x="331" y="212" text-anchor="middle" font-size="17" fill="#6B7C75" font-family="PingFang SC">中途别打断</text><text x="557" y="212" text-anchor="middle" font-size="17" fill="#6B7C75" font-family="PingFang SC">先看结论再看细节</text><text x="783" y="212" text-anchor="middle" font-size="17" fill="#6B7C75" font-family="PingFang SC">案例是答案的补充</text><text x="1009" y="212" text-anchor="middle" font-size="17" fill="#6B7C75" font-family="PingFang SC">追问才是关键一步</text></svg>